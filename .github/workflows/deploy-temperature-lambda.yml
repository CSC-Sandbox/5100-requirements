name: Deploy Temperature Lambda

on:
  push:
    branches:
      - main
    paths:
      - "src/main/java/edu/calpoly/lambdalab/instructor/**"
      - "src/test/java/edu/calpoly/lambdalab/instructor/**"
      - "pom.xml"
      - ".github/workflows/deploy-temperature-lambda.yml"

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Get the code from GitHub
      - name: Checkout repository
        uses: actions/checkout@v6

      # 2. Install Java
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # 3. Compile, test, and package
      - name: Build and test
        run: mvn clean package

      # 4. Authenticate GitHub Actions with AWS using OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # 5. Deploy the JAR created by Maven
      - name: Deploy to AWS Lambda
        run: |
          aws lambda update-function-code \
            --function-name csc5100-temperature \
            --zip-file fileb://target/csc5100-1.0.jar
