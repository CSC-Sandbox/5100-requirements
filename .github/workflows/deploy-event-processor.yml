name: Deploy A04 Event Processor

on:
  push:
    branches:
      - main
    paths:
      - "src/main/java/edu/calpoly/lambdalab/instructor/**"
      - "src/test/java/edu/calpoly/lambdalab/instructor/**"
      - "pom.xml"
      - ".github/workflows/deploy-event-processor.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build and test
        run: mvn clean package
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Deploy consumer JAR
        run: |
          aws lambda update-function-code \
            --function-name csc5100-event-processor \
            --zip-file fileb://target/csc5100-1.0.jar
