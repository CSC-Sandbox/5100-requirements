name: A04 Sync Sprint 3 Fields

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync issue types and GitHub Project fields
        env:
          A04_PROJECT_TOKEN: ${{ secrets.A04_PROJECT_TOKEN }}
        run: |
          test -n "$A04_PROJECT_TOKEN" || { echo "Set repository secret A04_PROJECT_TOKEN with Issues write and Projects write access"; exit 1; }
          python3 scripts/a04_sync_sprint3.py
